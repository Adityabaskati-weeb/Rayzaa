<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Rayzaa deployment topology</title>
  <desc id="desc">Vercel serves the frontend dashboards and connects to a Render-hosted FastAPI backend, which also talks to the locked model artifact, Razorpay webhook, and Telegram Bot API.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .bg { fill: #faf7f2; }
      .panel { fill: #ffffff; stroke: #d7d0c4; stroke-width: 2; }
      .title { fill: #1a1a1a; font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif; font-size: 20px; font-weight: 600; }
      .sub { fill: #66635d; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 1.2px; }
      .line { stroke: #1a1a1a; stroke-width: 2.2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="380"/>
  <rect class="panel" x="60" y="120" width="250" height="100"/>
  <text class="title" x="185" y="160" text-anchor="middle">Vercel Frontend</text>
  <text class="sub" x="185" y="188" text-anchor="middle">PayEasy + Rayzaa dashboards</text>

  <rect class="panel" x="470" y="100" width="270" height="140"/>
  <text class="title" x="605" y="155" text-anchor="middle">Render Backend</text>
  <text class="sub" x="605" y="183" text-anchor="middle">FastAPI + WebSocket API</text>
  <text class="sub" x="605" y="207" text-anchor="middle">scoring + replay + queue</text>

  <rect class="panel" x="900" y="35" width="220" height="78"/>
  <text class="title" x="1010" y="78" text-anchor="middle">Locked model artifact</text>

  <rect class="panel" x="900" y="150" width="220" height="78"/>
  <text class="title" x="1010" y="193" text-anchor="middle">Razorpay webhook</text>

  <rect class="panel" x="900" y="265" width="220" height="78"/>
  <text class="title" x="1010" y="308" text-anchor="middle">Telegram Bot API</text>

  <line class="line" x1="310" y1="170" x2="470" y2="170"/>
  <line class="line" x1="740" y1="120" x2="900" y2="74"/>
  <line class="line" x1="740" y1="170" x2="900" y2="189"/>
  <line class="line" x1="740" y1="220" x2="900" y2="304"/>
  <text class="sub" x="390" y="158" text-anchor="middle">API + live state</text>
  <text class="sub" x="810" y="98" text-anchor="middle">model load</text>
  <text class="sub" x="822" y="168" text-anchor="middle">payment.captured</text>
  <text class="sub" x="818" y="276" text-anchor="middle">operational alert</text>
</svg>
