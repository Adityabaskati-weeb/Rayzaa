<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">End-to-end payment to investigation flow</title>
  <desc id="desc">A sequence view showing PayEasy checkout, Razorpay webhook, model scoring, Rayzaa command center update, and Telegram alert.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .bg { fill: #faf7f2; }
      .line { stroke: #cfc7b9; stroke-width: 2; stroke-dasharray: 8 8; }
      .msg { stroke: #1a1a1a; stroke-width: 2.2; marker-end: url(#arrow); }
      .return { stroke: #66635d; stroke-width: 2; stroke-dasharray: 6 6; marker-end: url(#arrow); }
      .actor { fill: #ffffff; stroke: #d7d0c4; stroke-width: 2; }
      .actor-text { fill: #1a1a1a; font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif; font-size: 18px; font-weight: 600; }
      .label { fill: #66635d; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 1.2px; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1280" height="560"/>
  <g>
    <rect class="actor" x="40" y="32" width="140" height="48"/>
    <rect class="actor" x="220" y="32" width="160" height="48"/>
    <rect class="actor" x="430" y="32" width="140" height="48"/>
    <rect class="actor" x="620" y="32" width="170" height="48"/>
    <rect class="actor" x="840" y="32" width="170" height="48"/>
    <rect class="actor" x="1060" y="32" width="160" height="48"/>
    <text class="actor-text" x="110" y="62" text-anchor="middle">Customer</text>
    <text class="actor-text" x="300" y="62" text-anchor="middle">PayEasy</text>
    <text class="actor-text" x="500" y="62" text-anchor="middle">Razorpay</text>
    <text class="actor-text" x="705" y="62" text-anchor="middle">Rayzaa API</text>
    <text class="actor-text" x="925" y="62" text-anchor="middle">XGBoost + SHAP</text>
    <text class="actor-text" x="1140" y="62" text-anchor="middle">Ops + Telegram</text>
  </g>
  <g>
    <line class="line" x1="110" y1="80" x2="110" y2="520"/>
    <line class="line" x1="300" y1="80" x2="300" y2="520"/>
    <line class="line" x1="500" y1="80" x2="500" y2="520"/>
    <line class="line" x1="705" y1="80" x2="705" y2="520"/>
    <line class="line" x1="925" y1="80" x2="925" y2="520"/>
    <line class="line" x1="1140" y1="80" x2="1140" y2="520"/>
  </g>
  <g>
    <line class="msg" x1="110" y1="125" x2="300" y2="125"/>
    <text class="label" x="205" y="115" text-anchor="middle">1. Start checkout</text>

    <line class="msg" x1="300" y1="175" x2="705" y2="175"/>
    <text class="label" x="500" y="165" text-anchor="middle">2. Create order</text>

    <line class="msg" x1="705" y1="225" x2="500" y2="225"/>
    <text class="label" x="603" y="215" text-anchor="middle">3. Create Razorpay order</text>

    <line class="return" x1="500" y1="275" x2="300" y2="275"/>
    <text class="label" x="400" y="265" text-anchor="middle">4. Checkout session</text>

    <line class="msg" x1="110" y1="325" x2="500" y2="325"/>
    <text class="label" x="305" y="315" text-anchor="middle">5. Complete payment</text>

    <line class="msg" x1="500" y1="375" x2="705" y2="375"/>
    <text class="label" x="603" y="365" text-anchor="middle">6. payment.captured webhook</text>

    <line class="msg" x1="705" y1="425" x2="925" y2="425"/>
    <text class="label" x="815" y="415" text-anchor="middle">7. Build features and score</text>

    <line class="return" x1="925" y1="475" x2="705" y2="475"/>
    <text class="label" x="815" y="465" text-anchor="middle">8. Score + SHAP explanation</text>

    <line class="msg" x1="705" y1="515" x2="1140" y2="515"/>
    <text class="label" x="922" y="505" text-anchor="middle">9. Update queue, replay, alert</text>
  </g>
</svg>
